name: Construire le logiciel Windows

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["web/**", "src-tauri/**", "app-icon.png", "package.json"]

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Installer Tauri
        run: npm install
      - name: Créer les icônes
        run: npx tauri icon app-icon.png
      - name: Construire l'installateur
        run: npx tauri build
      - name: Mettre l'installateur à disposition
        uses: actions/upload-artifact@v4
        with:
          name: Mes-Enveloppes-Windows
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
